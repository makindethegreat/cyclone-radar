<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cyclone Radar</title><style>
:root{--bg:#0b0b10;--panel:#14141b;--line:#292832;--text:#efedf5;--muted:#9998a8;--purple:#9875f4;--lav:#cbbaff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{padding:22px 14px;border-right:1px solid var(--line);background:#0f0f15}.brand{font-weight:750;font-size:17px;padding:8px;margin-bottom:25px}.brand span{display:inline-grid;place-items:center;background:linear-gradient(140deg,#a78bff,#51318b);width:36px;height:36px;border-radius:11px;margin-right:9px}.nav button{display:block;width:100%;text-align:left;padding:11px;border:0;background:none;color:#aaa9b6;border-radius:9px;margin:4px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#241b32;color:#e4d9ff}.main{min-width:0}.top{display:flex;justify-content:space-between;align-items:center;padding:17px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0b0b10ed}.content{max-width:1200px;margin:auto;padding:28px}.muted{color:var(--muted)}h1{font-size:27px;margin:0}h2{font-size:17px;margin:0}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.stat,.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px}.stat b{font-size:24px;display:block;margin:6px 0}.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:15px}.card{margin:10px 0;background:#17171f}.tag{color:var(--lav);background:#251d35;border:1px solid #44355d;border-radius:20px;padding:4px 8px;font-size:11px}.card h3{font-size:16px;margin:10px 0 5px}.card p{color:#b0afbb;margin:5px 0}.btn{background:#211b2e;border:1px solid #4d3b70;color:#e4d9ff;padding:9px 12px;border-radius:8px;cursor:pointer}.btn.secondary{background:#17171e;border-color:var(--line);color:#ddd}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.filters button{background:#16161e;border:1px solid var(--line);color:#aaa;padding:7px 12px;border-radius:20px;cursor:pointer}.filters button.active{background:#2b2040;color:#e7ddff;border-color:#6b52a2}.search{background:#15151d;border:1px solid var(--line);color:white;padding:10px;border-radius:9px;width:min(400px,100%)}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.empty{padding:40px;text-align:center;color:var(--muted)}.modal{display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{background:#191921;border:1px solid #333;border-radius:14px;width:min(550px,100%);padding:20px}.modalbox input,.modalbox textarea,.modalbox select{width:100%;margin:5px 0 14px;background:#101017;border:1px solid #363640;border-radius:8px;padding:10px;color:white}.modalbox textarea{min-height:85px}.toast{position:fixed;bottom:20px;right:20px;background:#282234;padding:12px;border-radius:9px;display:none}.toast.show{display:block} @media(max-width:800px){.app{grid-template-columns:1fr}.side{position:static;border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.top{padding:15px}.content{padding:18px}} 
</style></head><body><div class="app"><aside class="side"><div class="brand"><span>◉</span> Cyclone Radar</div><nav class="nav" id="nav"><button class="active" data-page="overview">◫ Overview</button><button data-page="discover">◉ Discover</button><button data-page="saved">▣ Story Bank</button><button data-page="research">⌬ Research Lab</button><button data-page="trackers">⟳ Trackers</button></nav><p class="muted" style="font-size:12px;margin:24px 8px">Cyclone Mag · Editorial intelligence</p></aside><main class="main"><header class="top"><span class="muted" id="crumb">Radar / Overview</span><div class="row"><button class="btn secondary" id="export">Export</button><button class="btn" id="new">＋ Add story</button></div></header><div class="content" id="content"></div></main></div>
<div class="modal" id="modal"><div class="modalbox"><h2>Add editorial opportunity</h2><label>Story title</label><input id="title" placeholder="What might we explore?"><label>Category</label><select id="category"><option>Politics</option><option>Society</option><option>History</option><option>Religion</option><option>Culture</option><option>Economy</option><option>Environment</option></select><label>Editorial angle / why it matters</label><textarea id="desc" placeholder="Describe the question, signal or possible angle"></textarea><div class="row" style="justify-content:flex-end"><button class="btn secondary" id="cancel">Cancel</button><button class="btn" id="save">Save idea</button></div></div></div><div class="toast" id="toast"></div>
<script>
const sample=[{id:1,title:"The political lives of young Nigerians who no longer believe voting changes anything",category:"Politics",angle:"Explore the gap between political awareness and electoral trust through lived experiences.",type:"Human feature",priority:"High"},{id:2,title:"Why religious communities are becoming more than places of worship",category:"Religion",angle:"Examine how faith communities provide social, emotional and material support amid uncertainty.",type:"Interpretation",priority:"Medium"},{id:3,title:"The histories Lagos is slowly forgetting",category:"History",angle:"Document people, places and memories disappearing from the city’s public consciousness.",type:"Feature",priority:"Medium"},{id:4,title:"What Nigeria’s youth political participation actually looks like ahead of 2027",category:"Research",angle:"Study political interest, efficacy, online expression, voting intentions and participation barriers.",type:"Original research",priority:"High"},{id:5,title:"The invisible workers who keep Lagos moving",category:"Society",angle:"A human-angle exploration of informal labour and the systems that depend on it.",type:"Human feature",priority:"High"},{id:6,title:"What our obsession with leaving Nigeria tells us about aspiration",category:"Society",angle:"Interpret migration aspirations as a lens into opportunity, identity and imagined futures.",type:"Interpretation",priority:"Medium"}];
let ideas=JSON.parse(localStorage.getItem("radarIdeas")||"null")||sample;let saved=JSON.parse(localStorage.getItem("radarSaved")||"[]");let trackers=JSON.parse(localStorage.getItem("radarTrackers")||"[]");let research=JSON.parse(localStorage.getItem("radarResearch")||"[]");let page="overview",filter="All",query="";
const content=document.getElementById("content");function persist(){localStorage.setItem("radarIdeas",JSON.stringify(ideas));localStorage.setItem("radarSaved",JSON.stringify(saved));localStorage.setItem("radarTrackers",JSON.stringify(trackers));localStorage.setItem("radarResearch",JSON.stringify(research))}
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.className="toast show";setTimeout(()=>t.className="toast",1800)}
function card(i){return '<article class="card"><div class="row"><span class="tag">'+i.category+'</span><span class="tag">'+i.type+'</span><span class="muted">'+i.priority+' priority</span></div><h3>'+i.title+'</h3><p>'+i.angle+'</p><div class="row" style="margin-top:12px"><button class="btn secondary" onclick="saveIdea('+i.id+')">'+(saved.includes(i.id)?'Saved ✓':'Save to bank')+'</button><button class="btn secondary" onclick="trackIdea('+i.id+')">Track subject</button></div></article>'}
function filtered(){return ideas.filter(i=>(filter==="All"||i.category===filter)&&(!query||[i.title,i.angle,i.category].join(" ").toLowerCase().includes(query.toLowerCase())))}
function header(title,desc,action=''){return '<div class="head"><div><h1>'+title+'</h1><p class="muted">'+desc+'</p></div>'+action+'</div>'}
function render(){document.getElementById("crumb").textContent="Radar / "+page.charAt(0).toUpperCase()+page.slice(1);if(page==="overview"){content.innerHTML=header("Editorial radar","A workspace for discovering stories, tracking subjects and developing research.")+'<div class="stats"><div class="stat muted">Opportunities<b>'+ideas.length+'</b></div><div class="stat muted">Saved ideas<b>'+saved.length+'</b></div><div class="stat muted">Trackers<b>'+trackers.length+'</b></div><div class="stat muted">Research projects<b>'+research.length+'</b></div></div><div class="cols"><section class="panel"><h2>Priority opportunities</h2>'+ideas.slice(0,3).map(card).join("")+'</section><section class="panel"><h2>Workspace</h2><div class="card"><h3>Story Bank</h3><p>'+saved.length+' saved opportunities</p></div><div class="card"><h3>Research Lab</h3><p>'+research.length+' active projects</p></div><div class="card"><h3>Trackers</h3><p>'+trackers.length+' subjects being monitored</p></div><p class="muted">Sample ideas are editorial prompts, not verified current events.</p></section></div>'}else if(page==="discover"){content.innerHTML=header("Discover","Explore editorial possibilities. Sample ideas are starting points, not live intelligence.")+'<input class="search" id="search" placeholder="Search story opportunities…" value="'+query+'"><div class="filters">'+["All","Politics","Society","History","Religion","Culture","Economy","Environment","Research"].map(x=>'<button class="'+(filter===x?'active':'')+'" onclick="setFilter(\''+x+'\')">'+x+'</button>').join("")+'</div>'+filtered().map(card).join("")}else if(page==="saved"){content.innerHTML=header("Story Bank","Ideas you've saved for further consideration.")+(saved.length?ideas.filter(i=>saved.includes(i.id)).map(card).join(""):'<div class="empty">No saved ideas yet. Visit Discover and save stories to build your bank.</div>')}else if(page==="trackers"){content.innerHTML=header("Trackers","Subjects to follow over time.",'<button class="btn" onclick="addTracker()">＋ New tracker</button>')+(trackers.length?trackers.map(t=>'<div class="card"><h3>'+t.title+'</h3><p>'+t.note+'</p><small class="muted">Created '+t.date+'</small></div>').join(""):'<div class="empty">No trackers yet. Track an idea from Discover or create one here.</div>')}else if(page==="research"){content.innerHTML=header("Research Lab","Develop original studies and editorial research.",'<button class="btn" onclick="addResearch()">＋ New project</button>')+(research.length?research.map(r=>'<div class="card"><span class="tag">Research project</span><h3>'+r.title+'</h3><p>'+r.question+'</p></div>').join(""):'<div class="empty">No projects yet. Create a research project to start structuring questions, methods and findings.</div>')}else content.innerHTML=header("Welcome to Cyclone Radar","Select a workspace section from the navigation.");document.querySelectorAll("#nav button").forEach(b=>{b.classList.toggle("active",b.dataset.page===page)});let search=document.getElementById("search");if(search)search.oninput=e=>{query=e.target.value;render();document.getElementById("search")?.focus()}}
function setPage(p){page=p;render()}function setFilter(f){filter=f;render()}function saveIdea(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];persist();render();toast(saved.includes(id)?"Saved to Story Bank":"Removed from Story Bank")}function trackIdea(id){let i=ideas.find(x=>x.id===id);if(!i)return;trackers.push({title:i.title,note:i.angle,date:new Date().toLocaleDateString()});persist();toast("Added to Trackers")}
function addTracker(){let t=prompt("Tracker subject or issue:");if(t){trackers.push({title:t,note:"",date:new Date().toLocaleDateString()});persist();render()}}function addResearch(){let t=prompt("Research project title:");if(!t)return;let q=prompt("Primary research question:")||"";research.push({title:t,question:q});persist();render()}
document.getElementById("nav").onclick=e=>{let b=e.target.closest("button[data-page]");if(b){page=b.dataset.page;render()}};document.getElementById("new").onclick=()=>document.getElementById("modal").classList.add("show");document.getElementById("cancel").onclick=()=>document.getElementById("modal").classList.remove("show");document.getElementById("save").onclick=()=>{let t=document.getElementById("title").value.trim();if(!t)return toast("Add a title first");ideas.unshift({id:Date.now(),title:t,category:document.getElementById("category").value,angle:document.getElementById("desc").value||"Editorial angle to be developed.",type:"New idea",priority:"Medium"});persist();document.getElementById("modal").classList.remove("show");document.getElementById("title").value="";document.getElementById("desc").value="";render();toast("Idea added")};document.getElementById("export").onclick=()=>{let blob=new Blob([JSON.stringify({ideas,saved,trackers,research},null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="cyclone-radar-data.json";a.click();URL.revokeObjectURL(a.href)};render();
</script></body></html>
